[package]
name = "loan-escrow"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Fondealo loan escrow — collateralized funding, repayment, and default handling."

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
fondealo-soroban-shared = { path = "../../shared" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
business-passport = { path = "../business_passport" }
credit-score = { path = "../credit_score" }
