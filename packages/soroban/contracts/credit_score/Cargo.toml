[package]
name = "credit-score"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Fondealo Credit Reputation engine — deterministic, portable score that updates the Business Passport."

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
business-passport = { path = "../business_passport" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
