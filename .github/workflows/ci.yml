name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fondealo_kyb_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - name: KYB submission against PostgreSQL before acquisition migration
        run: pnpm --filter @fondealo/web exec vitest run src/lib/actions/kyb-postgres.test.ts
        env:
          KYB_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/fondealo_kyb_test
      - run: pnpm run build

  contracts:
    name: Soroban contracts (fmt · clippy · test · build wasm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/soroban
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/soroban
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      - run: cargo build --target wasm32v1-none --release
      - name: Verify all three contract artifacts
        run: |
          test -s target/wasm32v1-none/release/business_passport.wasm
          test -s target/wasm32v1-none/release/credit_score.wasm
          test -s target/wasm32v1-none/release/loan_escrow.wasm
