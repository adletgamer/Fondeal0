name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  contracts:
    name: Soroban contracts (fmt · clippy · test · build wasm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/soroban
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/soroban
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      # KNOWN BROKEN — backlog A9. Not enforced yet, on purpose.
      #
      # `credit_score` and `loan_escrow` depend on `business-passport` as a
      # Rust crate, and every contract crate exports symbols named `init`,
      # `admin`, and so on. Linking a dependent contract therefore pulls the
      # sibling's exports in and rust-lld fails with duplicate symbols. Only
      # `business_passport.wasm` builds today.
      #
      # This is pre-existing: the wasm step has never succeeded in CI. It was
      # previously masked by a target error (soroban-sdk 27 rejects
      # wasm32-unknown-unknown on Rust 1.82+), fixed in SA1.
      #
      # The fix is the standard Soroban multi-contract layout: shared types in
      # a non-contract crate plus `#[contractclient]` traits instead of
      # sibling-crate dependencies. That changes the exported surface of each
      # contract, so it gets its own phase with the contract tests as the net,
      # and must land before the Testnet deploy that needs these artifacts.
      #
      # fmt, clippy and the 50 contract tests above ARE enforced.
      - run: cargo build --target wasm32v1-none --release
        continue-on-error: true
